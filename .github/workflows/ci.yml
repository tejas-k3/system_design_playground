name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    name: no working-note markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only the published markdown files may be tracked
        run: |
          bad=$(git ls-files '*.md' | grep -vE '^(README\.md|AGENTS\.md|CLAUDE\.md|docs/DEPLOYMENT\.md|docs/ACCESSIBILITY_TESTING\.md|docs/COMPONENTS\.md)$' || true)
          if [ -n "$bad" ]; then echo "Unexpected tracked markdown:"; echo "$bad"; exit 1; fi
  backend:
    name: backend (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23", stable] # the declared minimum, and whatever is current
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: backend/go.sum
      # staticcheck needs a recent Go, so lint only on the current release
      - run: make lint
        if: matrix.go == 'stable'
      - run: make test-backend
      # allocations and bytes of the large-design benchmark are machine independent; time has a wide ceiling
      - run: make perf-guard
        if: matrix.go == 'stable'

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make test-frontend
      - run: npm run build
        working-directory: frontend

  browser:
    name: browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # layout at 5 laptop sizes, ghost-drag, auto-fit and the accessibility tree, in the Chrome the runner ships
      - run: make browser-check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t system-design-playground .
      - name: Smoke test the image
        run: |
          docker run -d --name app -p 8090:8090 system-design-playground
          for i in $(seq 1 20); do
            curl -fs http://localhost:8090/api/healthz && echo && exit 0
            sleep 1
          done
          docker logs app
          exit 1
