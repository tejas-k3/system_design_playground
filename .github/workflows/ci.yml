name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23", stable] # the declared minimum, and whatever is current
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: backend/go.sum
      # staticcheck needs a recent Go, so lint only on the current release
      - run: make lint
        if: matrix.go == 'stable'
      - run: make test-backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make test-frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t system-design-playground .
      - name: Smoke test the image
        run: |
          docker run -d --name app -p 8090:8090 system-design-playground
          for i in $(seq 1 20); do
            curl -fs http://localhost:8090/api/healthz && echo && exit 0
            sleep 1
          done
          docker logs app
          exit 1
